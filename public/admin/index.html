<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Admin Dashboard</title>

  <!-- Font sesuai Design System §9: Satoshi (heading) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500&display=swap" rel="stylesheet" />
  <!-- Ikon sesuai Design System §9: Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== LOGIN VIEW ===== -->
  <div id="login-view" class="login-page">
    <form id="login-form" class="login-card">
      <h1>HR Admin Dashboard</h1>
      <p class="subtitle">Masuk untuk kelola data karyawan</p>

      <div id="login-alert" class="alert alert-danger" hidden></div>

      <div class="field">
        <label for="login-identifier">Email atau Nomor HP</label>
        <input id="login-identifier" name="emailOrPhone" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button id="login-submit" type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
        <i class="ph ph-sign-in"></i> Masuk
      </button>
    </form>
  </div>

  <!-- ===== DASHBOARD VIEW ===== -->
  <div id="dashboard-view" hidden>
    <div class="topbar">
      <div class="brand"><i class="ph ph-buildings"></i> HR Admin Dashboard</div>
      <div class="user-chip">
        <span id="current-user-email"></span>
        <span id="current-user-role" class="role-badge"></span>
        <button id="logout-btn" class="btn-icon" title="Keluar"><i class="ph ph-sign-out"></i></button>
      </div>
    </div>

    <div class="page">
      <!-- Form create/edit karyawan -->
      <div id="employee-form-card" class="card" hidden>
        <div class="card-header">
          <h2 id="employee-form-title" style="font-size:16px;">Tambah Karyawan</h2>
          <button type="button" id="employee-form-close" class="btn-icon"><i class="ph ph-x"></i></button>
        </div>

        <div id="employee-form-alert" class="alert alert-danger" hidden></div>

        <form id="employee-form">
          <input type="hidden" id="employee-id" />

          <div class="form-grid">
            <div class="field" data-create-only>
              <label for="f-email">Email (akun login)</label>
              <input id="f-email" type="email" required />
            </div>
            <div class="field" data-create-only>
              <label for="f-phone">Nomor HP</label>
              <input id="f-phone" type="text" placeholder="08123456789" required />
            </div>
            <div class="field" data-create-only>
              <label for="f-password">Password Awal</label>
              <input id="f-password" type="password" minlength="8" required />
            </div>
            <div class="field" data-create-only>
              <label for="f-role">Role Akun</label>
              <select id="f-role">
                <option value="EMPLOYEE">Employee</option>
                <option value="MANAGER">Manager</option>
                <option value="HR_ADMIN">HR Admin</option>
                <option value="FINANCE">Finance</option>
                <option value="SUPER_ADMIN">Super Admin</option>
              </select>
            </div>

            <div class="field" data-create-only>
              <label for="f-employee-code">Kode Karyawan</label>
              <input id="f-employee-code" type="text" required />
            </div>
            <div class="field">
              <label for="f-full-name">Nama Lengkap</label>
              <input id="f-full-name" type="text" required />
            </div>

            <div class="field" data-create-only>
              <label for="f-company">Perusahaan</label>
              <select id="f-company" required></select>
            </div>
            <div class="field">
              <label for="f-branch">Cabang</label>
              <select id="f-branch" required></select>
            </div>
            <div class="field">
              <label for="f-department">Departemen</label>
              <select id="f-department" required></select>
            </div>
            <div class="field">
              <label for="f-position">Jabatan</label>
              <select id="f-position" required></select>
            </div>

            <div class="field">
              <label for="f-nik">NIK (16 digit)</label>
              <input id="f-nik" type="text" pattern="\d{16}" required />
            </div>
            <div class="field">
              <label for="f-npwp">NPWP (opsional)</label>
              <input id="f-npwp" type="text" pattern="\d{15,16}" />
            </div>
            <div class="field">
              <label for="f-bank-name">Nama Bank</label>
              <input id="f-bank-name" type="text" required />
            </div>
            <div class="field">
              <label for="f-bank-account">Nomor Rekening</label>
              <input id="f-bank-account" type="text" required />
            </div>

            <div class="field">
              <label for="f-employment-type">Jenis Karyawan</label>
              <select id="f-employment-type" required>
                <option value="PKWTT">PKWTT (Karyawan Tetap)</option>
                <option value="PKWT">PKWT (Kontrak)</option>
                <option value="HARIAN">Harian</option>
                <option value="MAGANG">Magang</option>
              </select>
            </div>
            <div class="field">
              <label for="f-marital-status">Status Pernikahan (PTKP)</label>
              <select id="f-marital-status" required>
                <option value="TK">Tidak Kawin (TK)</option>
                <option value="K">Kawin (K)</option>
              </select>
            </div>

            <div class="field" data-create-only>
              <label for="f-join-date">Tanggal Bergabung</label>
              <input id="f-join-date" type="date" required />
            </div>
            <div class="field">
              <label for="f-dependents-count">Jumlah Tanggungan</label>
              <input id="f-dependents-count" type="number" min="0" value="0" />
            </div>

            <div class="field" data-edit-only hidden>
              <label for="f-status">Status Karyawan</label>
              <select id="f-status">
                <option value="ACTIVE">Aktif</option>
                <option value="INACTIVE">Nonaktif</option>
                <option value="RESIGNED">Resign</option>
              </select>
            </div>
            <div class="field" data-edit-only hidden>
              <label for="f-resign-date">Tanggal Resign (opsional)</label>
              <input id="f-resign-date" type="date" />
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="employee-form-cancel" class="btn btn-ghost">Batal</button>
            <button type="submit" id="employee-form-submit" class="btn btn-primary">
              <i class="ph ph-check"></i> Simpan
            </button>
          </div>
        </form>
      </div>

      <!-- Daftar karyawan -->
      <div class="card">
        <div class="card-header">
          <h2 style="font-size:16px;">Data Karyawan</h2>
          <button type="button" id="employee-add-btn" class="btn btn-primary">
            <i class="ph ph-plus"></i> Tambah Karyawan
          </button>
        </div>

        <div id="employee-list-alert" class="alert alert-danger" hidden></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Kode</th>
                <th>Nama</th>
                <th>Cabang</th>
                <th>Departemen</th>
                <th>Jabatan</th>
                <th>Jenis</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="employee-table-body"></tbody>
          </table>
        </div>

        <div id="employee-empty" class="empty-state" hidden>
          <i class="ph ph-users-three"></i>
          <p>Belum ada data karyawan.</p>
        </div>

        <div class="pagination">
          <button type="button" id="page-prev" class="btn-icon"><i class="ph ph-caret-left"></i></button>
          <span id="page-info">Halaman 1</span>
          <button type="button" id="page-next" class="btn-icon"><i class="ph ph-caret-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
