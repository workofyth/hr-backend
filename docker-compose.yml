services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME wajib diisi di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env (tidak boleh kosong untuk Docker)}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE wajib diisi di .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5434 (bukan 5432) supaya tidak bentrok dengan Postgres lain
      # yang mungkin sudah jalan di mesin ini (lokal atau container lain).
      # App tetap konek lewat network internal compose (service name
      # "postgres", port 5432) — port host ini cuma untuk akses manual
      # (psql/DBeaver) dari luar. Ganti sesuai kebutuhan kalau masih bentrok.
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host/port supaya app selalu konek ke service Postgres di
      # dalam network compose, apa pun isi DB_HOST/DB_PORT di .env lokal.
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:${APP_PORT:-3000}/api/v1/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
